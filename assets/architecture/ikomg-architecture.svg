<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="950" fill="url(#bg)"/>
  <circle cx="190" cy="130" r="230" fill="#38bdf8" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1380" cy="180" r="260" fill="#22c55e" opacity="0.09" filter="url(#glow)"/>
  <circle cx="780" cy="900" r="300" fill="#2563eb" opacity="0.10" filter="url(#glow)"/>

  <rect x="45" y="40" width="1510" height="870" rx="36" fill="rgba(15,23,42,0.70)" stroke="rgba(148,163,184,0.22)"/>

  <text x="90" y="112" fill="#e5e7eb" font-size="46" font-family="Arial, sans-serif" font-weight="800">IKOMG — Cloud Run & MongoDB Atlas Architecture</text>
  <text x="90" y="158" fill="#94a3b8" font-size="22" font-family="Arial, sans-serif">GCP Cloud Run services with Cloud SQL, MongoDB Atlas, VPC egress and Artifact Registry deployment</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700" filter="url(#shadow)">
    <rect x="95" y="260" width="210" height="96" rx="22" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
    <text x="200" y="316" fill="#e5e7eb" font-size="23">Users / APIs</text>

    <rect x="375" y="260" width="230" height="96" rx="22" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
    <text x="490" y="316" fill="#e5e7eb" font-size="23">DNS / CDN</text>

    <rect x="675" y="260" width="250" height="96" rx="22" fill="url(#card)" stroke="#22c55e" stroke-width="2"/>
    <text x="800" y="316" fill="#e5e7eb" font-size="23">HTTPS LB / VPC</text>

    <rect x="995" y="260" width="280" height="96" rx="22" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
    <text x="1135" y="316" fill="#e5e7eb" font-size="23">Cloud Run Gen2</text>

    <rect x="230" y="520" width="250" height="96" rx="22" fill="url(#card)" stroke="#f59e0b" stroke-width="2"/>
    <text x="355" y="576" fill="#e5e7eb" font-size="23">Cloud SQL</text>

    <rect x="555" y="520" width="250" height="96" rx="22" fill="url(#card)" stroke="#a855f7" stroke-width="2"/>
    <text x="680" y="576" fill="#e5e7eb" font-size="23">MongoDB Atlas</text>

    <rect x="880" y="520" width="250" height="96" rx="22" fill="url(#card)" stroke="#22c55e" stroke-width="2"/>
    <text x="1005" y="576" fill="#e5e7eb" font-size="23">Artifact Registry</text>

    <rect x="1205" y="520" width="250" height="96" rx="22" fill="url(#card)" stroke="#38bdf8" stroke-width="2"/>
    <text x="1330" y="576" fill="#e5e7eb" font-size="23">Cloud Logging</text>
  </g>

  <g stroke="url(#line)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M305 308 H375"/>
    <path d="M605 308 H675"/>
    <path d="M925 308 H995"/>
    <path d="M1135 356 V435 H355 V520"/>
    <path d="M1135 356 V435 H680 V520"/>
    <path d="M1135 356 V435 H1005 V520"/>
    <path d="M1135 356 V435 H1330 V520"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="720" width="1420" height="82" rx="22" fill="rgba(2,6,23,0.60)" stroke="rgba(148,163,184,0.16)"/>
    <text x="130" y="755" fill="#38bdf8" font-size="22" font-weight="800">DevOps Responsibilities</text>
    <text x="130" y="786" fill="#cbd5e1" font-size="20">CI/CD automation • Cloud networking • Security hardening • Observability • Database connectivity • Production reliability</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="90" y="835" width="142" height="38" rx="19" fill="rgba(56,189,248,0.10)" stroke="rgba(56,189,248,0.28)"/>
    <text x="161" y="860" fill="#bae6fd" text-anchor="middle">Cloud</text>

    <rect x="252" y="835" width="142" height="38" rx="19" fill="rgba(34,197,94,0.10)" stroke="rgba(34,197,94,0.28)"/>
    <text x="323" y="860" fill="#bbf7d0" text-anchor="middle">CI/CD</text>

    <rect x="414" y="835" width="170" height="38" rx="19" fill="rgba(245,158,11,0.10)" stroke="rgba(245,158,11,0.28)"/>
    <text x="499" y="860" fill="#fde68a" text-anchor="middle">Monitoring</text>

    <rect x="604" y="835" width="150" height="38" rx="19" fill="rgba(168,85,247,0.10)" stroke="rgba(168,85,247,0.28)"/>
    <text x="679" y="860" fill="#e9d5ff" text-anchor="middle">Security</text>
  </g>
</svg>
