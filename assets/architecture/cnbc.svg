<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="45%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blueGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="850" fill="url(#bg)"/>

  <circle cx="170" cy="120" r="180" fill="#38bdf8" opacity="0.10" filter="url(#glow)"/>
  <circle cx="1220" cy="190" r="210" fill="#22c55e" opacity="0.10" filter="url(#glow)"/>
  <circle cx="700" cy="780" r="230" fill="#2563eb" opacity="0.10" filter="url(#glow)"/>

  <rect x="42" y="38" width="1316" height="774" rx="34" fill="rgba(15,23,42,0.62)" stroke="rgba(148,163,184,0.22)"/>

  <text x="84" y="104" fill="#e5e7eb" font-size="42" font-family="Arial, sans-serif" font-weight="800">CNBC Arabia Cloud Architecture</text>
  <text x="84" y="145" fill="#94a3b8" font-size="21" font-family="Arial, sans-serif">Media/news cloud architecture with WAF, apps, database and monitoring</text>

  <g font-family="Arial, sans-serif" text-anchor="middle" font-weight="700" filter="url(#shadow)">
    <rect x="92" y="260" width="210" height="92" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="197" y="315" fill="#e5e7eb" font-size="23">DNS</text>

    <rect x="382" y="260" width="230" height="92" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="497" y="315" fill="#e5e7eb" font-size="23">WAF / LB</text>

    <rect x="692" y="260" width="230" height="92" rx="22" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="807" y="315" fill="#e5e7eb" font-size="23">Web/API</text>

    <rect x="1002" y="260" width="250" height="92" rx="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="1127" y="315" fill="#e5e7eb" font-size="23">Database</text>

    <rect x="295" y="510" width="250" height="92" rx="22" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="420" y="565" fill="#e5e7eb" font-size="23">Managed DB</text>

    <rect x="642" y="510" width="285" height="92" rx="22" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="785" y="565" fill="#e5e7eb" font-size="23">Grafana</text>

    <rect x="1012" y="510" width="240" height="92" rx="22" fill="#0f172a" stroke="#a855f7" stroke-width="2"/>
    <text x="1132" y="565" fill="#e5e7eb" font-size="23">CI/CD</text>
  </g>

  <g stroke="url(#blueGreen)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M302 306 H382"/>
    <path d="M612 306 H692"/>
    <path d="M922 306 H1002"/>
    <path d="M1127 352 V430 H420 V510"/>
    <path d="M1127 352 V430 H785 V510"/>
    <path d="M1127 352 V430 H1132 V510"/>
  </g>

  <g font-family="Arial, sans-serif">
    <rect x="84" y="690" width="1230" height="56" rx="18" fill="rgba(2,6,23,0.55)" stroke="rgba(148,163,184,0.16)"/>
    <text x="116" y="725" fill="#94a3b8" font-size="20">DevOps Focus:</text>
    <text x="260" y="725" fill="#e5e7eb" font-size="20">Scalable deployment • Secure networking • Monitoring • Release automation • Production reliability</text>
  </g>
</svg>
