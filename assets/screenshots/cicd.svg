<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1400" height="850" fill="url(#bg)"/>
  <rect x="42" y="38" width="1316" height="774" rx="34" fill="rgba(15,23,42,0.70)" stroke="rgba(148,163,184,0.20)"/>

  <text x="84" y="104" fill="#e5e7eb" font-size="42" font-family="Arial" font-weight="800">CI/CD Pipeline Automation</text>
  <text x="84" y="145" fill="#94a3b8" font-size="21" font-family="Arial">GitHub → Build → Container Registry → Security Checks → Cloud Run / Kubernetes</text>

  <g font-family="Arial" font-size="22" font-weight="800" text-anchor="middle" filter="url(#shadow)">
    <rect x="92" y="310" width="190" height="100" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="187" y="368" fill="#e5e7eb">GitHub</text>

    <rect x="342" y="310" width="190" height="100" rx="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="437" y="368" fill="#e5e7eb">Build</text>

    <rect x="592" y="310" width="230" height="100" rx="24" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="707" y="368" fill="#e5e7eb">Registry</text>

    <rect x="882" y="310" width="220" height="100" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="992" y="368" fill="#e5e7eb">Security</text>

    <rect x="1162" y="310" width="170" height="100" rx="24" fill="#0f172a" stroke="#22c55e" stroke-width="2"/>
    <text x="1247" y="368" fill="#e5e7eb">Deploy</text>
  </g>

  <g stroke="url(#line)" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M282 360 H342"/>
    <path d="M532 360 H592"/>
    <path d="M822 360 H882"/>
    <path d="M1102 360 H1162"/>
  </g>

  <g font-family="Arial">
    <rect x="130" y="540" width="1140" height="120" rx="24" fill="rgba(2,6,23,0.58)" stroke="rgba(148,163,184,0.18)"/>
    <text x="170" y="585" fill="#e5e7eb" font-size="24" font-weight="800">Pipeline Capabilities</text>
    <text x="170" y="625" fill="#94a3b8" font-size="20">Automated image build • Artifact promotion • Environment based deployment • Rollback support • Monitoring integration</text>
  </g>
</svg>
